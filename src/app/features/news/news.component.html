<div class="wrapper">
    @if(authStore.isLoggedIn()){
    <button mat-raised-button
        (click)="onAddNews()">edit news</button>
    }
    @if(appStore.activeLanguage() === 'nl') {

    <div class="news"
        [innerHTML]="newsStore.contentNl()">
    </div>

    } @else {

    <div class="news"
        [innerHTML]="newsStore.contentEn()">
    </div>

    }

</div>
